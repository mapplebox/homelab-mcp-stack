#!/usr/sbin/nft -f
# /etc/nftables.conf for the Proxmox MCP LXC (Debian, nftables.service)
#
# ProxmoxMCP-Plus runs directly in a venv (no Docker), and Debian uses nftables.
# This is Debian's default file plus two rules: port 8000 only from the Caddy host.
#
# The input policy stays "accept", like Debian's default. Nothing else is filtered,
# so SSH, loopback and established connections keep working and you can not lock
# yourself out with this file.
#
# Apply:
#   nft -c -f /etc/nftables.conf        # check only, changes nothing
#   systemctl enable --now nftables     # loads the file now and at every boot
#   nft -f /etc/nftables.conf           # reload after edits
#   nft list ruleset                    # show what is active

flush ruleset

define CADDY_IP = 192.168.1.10    # your Caddy host
define MCP_PORT = 8000            # ProxmoxMCP-Plus

table inet filter {
	chain input {
		type filter hook input priority filter; policy accept;

		iifname "lo" accept
		tcp dport $MCP_PORT ip saddr $CADDY_IP accept
		tcp dport $MCP_PORT drop    # everyone else, IPv4 and IPv6
	}
	chain forward {
		type filter hook forward priority filter; policy accept;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
