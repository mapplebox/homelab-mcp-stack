# UniFi Network MCP (sirkirby/unifi-mcp), deployed in /opt/mcp-unifi. One instance per UniFi site/console.
# .env     (chmod 600): UNIFI_NETWORK_USERNAME / UNIFI_NETWORK_PASSWORD (local UniFi account, no SSO/2FA), BEARER_TOKEN
# site.env: UNIFI_NETWORK_HOST + UNIFI_MCP_ALLOWED_HOSTS for this site
# Port 3000 only accepts the Caddy host, see ../common/mcp-firewall.service
services:
  unifi-network-mcp:
    image: ghcr.io/sirkirby/unifi-network-mcp:0.20.3
    container_name: unifi-network-mcp
    restart: unless-stopped
    ports: ["0.0.0.0:3000:3000"]
    env_file: [site.env, .env]
    environment:
      UNIFI_MCP_HTTP_ENABLED: "true"
      UNIFI_MCP_HTTP_FORCE: "true"
      UNIFI_MCP_HOST: 0.0.0.0
      UNIFI_MCP_PORT: "3000"
      UNIFI_NETWORK_PORT: "443"
      UNIFI_NETWORK_SITE: default
      UNIFI_NETWORK_VERIFY_SSL: "false"        # the console uses a self-signed cert
      UNIFI_TOOL_PERMISSION_MODE: confirm      # every change: preview first, then explicit confirm
      UNIFI_POLICY_DELETE: "false"             # no deletions at all (enable per category only when really needed)
